spring.application.name=celestia_be

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
spring.profiles.active=local

server.port=8082

cors.allowed-origins=http://localhost:5173,http://localhost:5174

# true only in production (requires HTTPS)
security.cookie.secure=false

# ------------------------------------------------------------
# Secrets are set in application-local.properties (git-ignored),
# loaded on top of this file because spring.profiles.active=local.
# Keep the values below EMPTY in the committed file.
# In deployment, provide them as environment variables, e.g.
#   SPRING_DATA_MONGODB_URI, SECURITY_JWT_SECRET_KEY,
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET, GROQ_API_KEY
# ------------------------------------------------------------
spring.data.mongodb.uri=

logging.level.org.springframework.security=DEBUG

groq.api-key=
# Groq model id. Override via GROQ_MODEL env var or application-local.properties.
# llama-3.3-70b-versatile was retired 2026-08-16; use a current GroqCloud model.
groq.model=openai/gpt-oss-120b

security.jwt.secret-key=
security.jwt.exp-time=86400000

# Cloudinary keys - set in application-local.properties (not committed)
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=